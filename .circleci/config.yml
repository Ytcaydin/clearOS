version: 2.1
jobs:
  build-apk:
    docker:
      - image: cimg/android:2026.08.1
    resource_class: large
    steps:
      - checkout
      - run:
          name: Android 16 SDK
          command: |
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run:
          name: Java güvenlik ve regresyon testleri
          command: ./tools/test-scanner.sh
      - run:
          name: Manifest, XML ve gizlilik kontrolleri
          command: python3 tools/quality-check.py
      - run:
          name: 10.000 dosyalık tarama duman testi
          command: bash tools/stress-100k.sh 10000
      - run:
          name: Debug APK - SHA-256 doğrulamalı Gradle wrapper
          command: ./gradlew --no-daemon --stacktrace assembleDebug
      - store_artifacts:
          path: app/build/outputs/apk/debug
          destination: clearos-ultra-apk
workflows:
  build:
    jobs:
      - build-apk
