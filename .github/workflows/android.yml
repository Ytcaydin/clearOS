name: ClearOS Ultra Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Güvenlik ve regresyon testleri (saf Java)
        run: bash tools/test-scanner.sh

      - name: Manifest, XML ve gizlilik kontrolleri
        run: python3 tools/quality-check.py

      - name: 10.000 dosyalık tarama duman testi
        run: bash tools/stress-100k.sh 10000

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug APK derle
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: ClearOS-Ultra-v5-rc2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
