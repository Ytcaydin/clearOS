name: ClearOS Ultra Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Güvenlik ve regresyon testleri (saf Java)
        run: bash tools/test-scanner.sh

      - name: Manifest, XML ve gizlilik kontrolleri
        run: python3 tools/quality-check.py

      - name: 10.000 dosyalık tarama duman testi
        run: bash tools/stress-100k.sh 10000

      - uses: gradle/actions/setup-gradle@v4

      - name: Yazı tipleri (Doto, Space Grotesk, Space Mono · SIL OFL)
        run: |
          D=app/src/main/assets/fonts; mkdir -p "$D"
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          get() { curl -fsSL --retry 3 -o "$D/$2" "$B/$1" && echo "ok  $2" || echo "::warning::Yazı tipi indirilemedi: $1 (sistem yazı tipi kullanılacak)"; }
          get 'doto/Doto%5BROND,wght%5D.ttf' Doto.ttf
          get 'doto/OFL.txt' Doto-OFL.txt
          get 'spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf' SpaceGrotesk.ttf
          get 'spacegrotesk/OFL.txt' SpaceGrotesk-OFL.txt
          get 'spacemono/SpaceMono-Regular.ttf' SpaceMono-Regular.ttf
          get 'spacemono/SpaceMono-Bold.ttf' SpaceMono-Bold.ttf
          get 'spacemono/OFL.txt' SpaceMono-OFL.txt
          ls -la "$D"

      - name: Sabit imza anahtarı (güncelleme olarak kurulabilsin)
        env:
          KEYSTORE_B64: ${{ secrets.CLEAROS_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/clearos-debug.keystore"
            echo "CLEAROS_KEYSTORE_FILE=$RUNNER_TEMP/clearos-debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::CLEAROS_DEBUG_KEYSTORE secret tanımlı değil. APK rastgele debug anahtarıyla imzalanacak ve eski sürümün üzerine güncelleme olarak kurulamayacak."
          fi

      - name: Debug APK derle
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: İmzayı göster
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/*.apk | grep -E "SHA-256|DN"
          [ -n "${CLEAROS_KEYSTORE_FILE:-}" ] && echo "Sabit anahtar kullanıldı." || echo "UYARI: rastgele debug anahtarı."

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: ClearOS-Ultra-v5-rc2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
