plugins {
    id 'com.android.application'
}

android {
    namespace 'com.clearos.ultra'
    compileSdk 36

    defaultConfig {
        applicationId 'com.clearos.ultra'
        minSdk 30
        targetSdk 36
        versionCode 59
        versionName '5.1.4'
    }
    // Stable signing so a new APK installs as an UPDATE (no uninstall, data kept).
    // CI decodes the CLEAROS_DEBUG_KEYSTORE GitHub secret and exports its path. Without it
    // (local builds, forks) Gradle keeps the machine's own debug key.
    signingConfigs {
        debug {
            def ks = System.getenv('CLEAROS_KEYSTORE_FILE')
            if (ks && file(ks).isFile()) {
                storeFile file(ks)
                storePassword 'clearos-debug'
                keyAlias 'clearos'
                keyPassword 'clearos-debug'
            }
        }
    }
    buildFeatures { aidl true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'androidx.media3:media3-transformer:1.9.4'
    implementation 'androidx.media3:media3-effect:1.9.4'
}
